<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marvel vs DC, 1935-2013</title>
  <link rel="stylesheet" href="style.css?v=2" />
  
</head>
<body>
  <header class="topbar">
    <h1>Marvel vs DC <span class="years">1935-2013</span></h1>
    <!-- Shared filters: built by script.js on every page -->
    <section class="filters" id="filters" aria-label="Filters"></section>
  </header>

  <main class="grid">
    <!-- V1 -->
    <section class="panel v1">
      <h2>Debuts by gender and top characters</h2>
      <div class="panel-body two-col">
        <div class="idiom" id="idiom-1">idiom 1</div>
        <div class="idiom" id="idiom-2">idiom 2</div>
      </div>
    </section>

    <!-- V2 -->
    <section class="panel v2">
      <h2>Power vs popularity</h2>
      <div class="panel-body stack">
        <div class="idiom" id="idiom-3">idiom 3</div>
        <div class="idiom" id="idiom-4">idiom 4</div>
      </div>
    </section>

    <!-- V3 -->
    <section class="panel v3">
      <h2>Origin flow and team overlap</h2>
      <div class="panel-body two-col">
        <div class="idiom" id="idiom-5">idiom 5</div>
        <div class="idiom" id="idiom-6">idiom 6</div>
      </div>
    </section>
  </main>
  <script src="lib/d3.min.js"></script>
  <script src="lib/d3-sankey.min.js"></script>
  <script src="script.js"></script>
  <script src="V1.js"></script>
  <script src="V2.js"></script>
  <script src="V3.js"></script>
</body>
</html>
