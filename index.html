<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marvel vs DC, 1935-2013</title>
  <link rel="stylesheet" href="style.css" />
  
</head>
<body>
  <header class="topbar">
    <h1>Marvel vs DC, 1935-2013</h1>
    <div class="legend" aria-label="Publisher colors">
      <span class="legend-item"><i class="swatch dc"></i>DC</span>
      <span class="legend-item"><i class="swatch marvel"></i>Marvel</span>
    </div>
  </header>

  <!-- Shared filters: built by script.js on every page -->
  <section class="filters" id="filters" aria-label="Filters"></section>

  <main class="grid">
    <!-- V1 -->
    <section class="panel v1">
      <h2>Female debuts and top characters</h2>
      <div class="panel-body two-col">
        <div class="idiom" id="idiom-1">idiom 1</div>
        <div class="idiom" id="idiom-2">idiom 2</div>
      </div>
    </section>

    <!-- V2 -->
    <section class="panel v2">
      <h2>Power vs popularity</h2>
      <div class="panel-body stack">
        <div class="idiom drawn shot" id="idiom-3"><img src="images/v2-scatter.png" alt="V2 sketch: power vs popularity scatter plot" /></div>
        <div class="idiom drawn shot" id="idiom-4"><img src="images/v2-ranges.png" alt="V2 sketch: range plot by era and publisher" /></div>
      </div>
    </section>

    <!-- V3 -->
    <section class="panel v3">
      <h2>Origin flow and team overlap</h2>
      <div class="panel-body two-col">
        <div class="idiom drawn shot" id="idiom-5"><img src="images/v3-origin-flow.png" alt="V3 sketch: origin flow diagram" /></div>
        <div class="idiom drawn shot" id="idiom-6"><img src="images/v3-team-overlap.png" alt="V3 sketch: team overlap matrix" /></div>
      </div>
    </section>
  </main>
  <script src="lib/d3.min.js"></script>
  <script src="script.js"></script>
  <script src="V1.js"></script>
</body>
</html>
